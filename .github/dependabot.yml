# Pull requests to update what is pinned: the Actions, by full commit SHA, and the one dev package.
# Monthly and grouped, so an update is one pull request to read (decision 53).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
