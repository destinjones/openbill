# Deploys the website, https://destinjones.github.io/openbill/, on every push to main.
# The site is the three files the pages load: openbill.html (also served as index.html),
# methodology.html, and the real data/drugs.json from Git LFS, never its pointer.
# Settings > Pages > Source must be "GitHub Actions" (set once; free on a public repository).
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same LFS cache as CI, so a deploy downloads data/drugs.json only when it has changed.
      - name: List the LFS objects this commit needs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The pages being published are in sync with src/ and data/
        run: node build.js --check

      - name: Unit, data, spot-check, sync, quality and docs-link tests
        run: node --test

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp openbill.html _site/index.html
          cp openbill.html methodology.html _site/
          cp data/drugs.json _site/data/drugs.json
          if head -c 64 _site/data/drugs.json | grep -q '^version https://git-lfs'; then
            echo "data/drugs.json is a Git LFS pointer; refusing to publish it" >&2
            exit 1
          fi
          ls -l _site _site/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
