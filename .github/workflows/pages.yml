# Deploys the website, https://destinjones.github.io/openbill/, after CI has passed on main, browser
# checks included (decision 55), or by hand from main.
# The site is built here and never committed (docs/ARCHITECTURE.md, "Drug pages"):
# openbill.html (also served as index.html), methodology.html, the real data/drugs.json from Git
# LFS (never its pointer), and tools/site.mjs's static pages: one per drug, one per FDA
# pharmacologic class, an A–Z index, a 1200×630 preview image per drug, the press kit (press/) with
# its wordmark, screenshots and reveal clips (decision 51), and sitemap.xml.
# Settings > Pages > Source must be "GitHub Actions" (set once; free on a public repository).
name: Website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The build job runs npm packages, a downloaded Chromium and the tests, so it gets read access
# only; the Pages scopes belong to the deploy job alone.
permissions:
  contents: read

# A deployment that has started finishes; a newer push waits for it rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only a passed CI run of a push to this repository's main deploys. A pull request from a fork's
  # branch that happens to be called main also triggers this, so the event and the repository are
  # checked. And only the commit main is at now: a re-run, or runs finishing out of order, must not
  # put older code back on the site.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.newest.outputs.deploy }}
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - id: newest
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          DISPATCHED: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        # No answer about main stops the gate, red, so the run can be re-run. Read as "main has moved
        # on", it skipped the deploy and stayed green (decision 56).
        run: |
          sha="${TESTED:-$DISPATCHED}"
          main=$(git ls-remote "https://github.com/${REPOSITORY}" refs/heads/main) || { echo "could not ask GitHub which commit main is at" >&2; exit 1; }
          main="${main%%[[:space:]]*}"
          if [ -z "${main}" ]; then
            echo "GitHub named no commit for main" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ -n "${TESTED}" ] && [ "${main}" != "${TESTED}" ]; then
            echo "CI passed on ${TESTED}, but main is now at ${main}; that commit's run deploys." >&2
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # configure-pages reads the Pages settings; nothing in this job can write to them.
    permissions:
      contents: read
      pages: read
    # About 3× a full local build (pages, every preview image, the tests); see the build step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is by the time this runs.
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          # Full history: the sitemap's lastmod is the date of the last commit touching each file.
          fetch-depth: 0

      # Same LFS cache as CI, so a deploy downloads data/drugs.json only when it has changed.
      - name: List the LFS objects this commit needs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install the packages
        timeout-minutes: 7
        run: timeout 180 npm ci || { echo "npm ci failed or passed 3 minutes; trying once more" >&2; timeout 180 npm ci; }

      # The preview images are rendered with Playwright's Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: The pages being published are in sync with src/ and data/
        run: node build.js --check

      - name: Unit, data, spot-check, sync, quality, docs-link and site tests
        run: node --test

      - name: Build the site
        run: node tools/site.mjs --out _site

      - name: Check the site before publishing it
        run: |
          test -f _site/index.html || { echo "_site has no index.html" >&2; exit 1; }
          if head -c 64 _site/data/drugs.json | grep -q '^version https://git-lfs'; then
            echo "data/drugs.json is a Git LFS pointer; refusing to publish it" >&2
            exit 1
          fi
          products=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/drugs.json','utf8'));console.log(new Set(d.rows.map((r)=>r.name)).size)")
          pages=$(find _site/drug -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          images=$(find _site/og -maxdepth 1 -name '*.png' | wc -l)
          echo "products ${products}, drug pages ${pages}, preview images ${images}"
          if [ "${pages}" -lt "${products}" ]; then
            echo "only ${pages} drug pages for ${products} products; refusing to publish" >&2
            exit 1
          fi
          if [ "${images}" -le "${products}" ]; then
            echo "only ${images} preview images for ${products} products plus og/site.png; refusing to publish" >&2
            exit 1
          fi
          # The press kit and every picture it shows (the list is pressMediaFiles() in src/build/presspage.js).
          node --input-type=module -e "
            import fs from 'node:fs';
            import { pressMediaFiles } from './src/build/presspage.js';
            const missing = ['index.html', ...pressMediaFiles()].filter((f) => !fs.existsSync('_site/press/' + f) || fs.statSync('_site/press/' + f).size === 0);
            if (missing.length) { console.error('_site/press/ is missing ' + missing.join(', ') + '; refusing to publish'); process.exit(1); }
            console.log('press kit: index.html and ' + pressMediaFiles().length + ' pictures');
          "
          du -sh _site
          # GitHub Pages' published site limit is 1 GB. Stop here with room to spare, rather than
          # on a failed deploy (decision 55).
          bytes=$(du -sb _site | cut -f1)
          limit=900000000
          echo "site size ${bytes} bytes; this step fails above ${limit}"
          if [ "${bytes}" -gt "${limit}" ]; then
            echo "_site is ${bytes} bytes, over the ${limit} guard; refusing to publish. See docs/DECISIONS.md, decision 55." >&2
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
