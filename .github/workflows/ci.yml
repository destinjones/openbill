name: CI

# Each pull request commit runs once, as a pull request; main runs after the merge, and the
# deploy waits for that run (pages.yml). The required checks are the jobs named test and links.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the one before. A run on main always
# finishes: the website deploys from it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # data/drugs.json is in Git LFS. Cache the LFS objects by their ids so each run
      # doesn't spend the repository's LFS bandwidth on a file that hasn't changed.
      - name: List the LFS objects this commit needs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # One install took seven of the job's twenty minutes (2026-11). It normally takes seconds, so a
      # slow one is stopped at three minutes and tried once more.
      - name: Install the packages
        timeout-minutes: 7
        run: timeout 180 npm ci || { echo "npm ci failed or passed 3 minutes; trying once more" >&2; timeout 180 npm ci; }

      - name: Generated files are up to date
        run: node build.js --check

      - name: Unit, data, spot-check, sync, quality and docs-link tests
        run: node --test

      # The deploy builds the site from the same data; build its pages here too (without the
      # preview images), so anything that would stop the deploy, such as two product names the
      # slug rules cannot tell apart, fails this required check before merge instead.
      - name: The website builds from this data
        run: node tools/site.mjs --out "$RUNNER_TEMP/openbill-site" --no-og

      - name: Install Chromium, Firefox and WebKit for Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser checks
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Links this commit can break by itself: relative links and anchors, and links into OpenBill's own
  # website, against this commit's build. A dead outside site does not fail it: external-links.yml
  # checks those, weekly, and is not a required check (decisions 13 and 50).
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The link test reads data/drugs.json (the page's #drug= links must name real products).
      - name: List the LFS objects this commit needs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Links into OpenBill's own website are checked against this commit's build of it, not the
      # live deploy, which only catches up after the merge (decision 50).
      - name: Build the website pages to check links into it
        run: node tools/site.mjs --out "$RUNNER_TEMP/openbill-site" --no-og

      - name: Relative links, anchors and links into the website resolve
        run: node --test tests/docs-links.test.js
        env:
          OPENBILL_SITE_DIR: ${{ runner.temp }}/openbill-site
