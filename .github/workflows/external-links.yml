# Do the outside sites OpenBill links to still answer? Weekly, by hand, and on a pull request that
# changes documents. Not a required check: an outside site's outage must not block a merge. It has
# no continue-on-error, on purpose: being separate is what keeps it out of the way, and a dead link
# then shows as a red scheduled run, which GitHub tells the owner about (decisions 13 and 50).
name: External links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"
      - "src/build/**"
      - "src/core/sources.js"
      - "src/core/config.js"
      - ".github/workflows/external-links.yml"

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The link test reads data/drugs.json (the page's #drug= links must name real products).
      - name: List the LFS objects this commit needs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: External links resolve
        run: node --test tests/docs-links.test.js
        env:
          OPENBILL_CHECK_EXTERNAL: "1"
